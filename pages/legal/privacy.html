<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Política de Privacidad | Café Cortero</title>

  <!-- Tipografía global -->
  <link rel="stylesheet" href="/css/core/tipografia.css">

  <!-- Footer styles -->
  <link rel="stylesheet" href="/css/ui/footer.css">

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- CSS legal -->
  <link rel="stylesheet" href="/css/pages/legal/legal.css?v=7">
</head>

<body>

  <main class="legal-container">
    <section class="legal-card">

      <!-- Botón volver -->
      <button type="button" class="back-btn" onclick="history.back()" aria-label="Volver">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>

      <!-- Header -->
      <header class="legal-header">
        <h1 class="legal-title">Política de Privacidad</h1>
        <p class="legal-subtitle">
          Esta página explica cómo usamos tus datos cuando inicias sesión en Café Cortero.
        </p>
      </header>

      <!-- Contenido dinámico desde site_settings -->
      <div class="legal-content" id="legalContent">
        <p class="legal-loading">Cargando...</p>
      </div>

    </section>
  </main>

  <div id="snackbar" class="snackbar" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/core/supabase-auth.js"></script>
  <script src="/js/ui/layout.js"></script>
  <script src="/js/ui/site-settings.js"></script>
  <script>
    (async function() {
      await window.loadSiteSettings();
      const s = window.siteSettings;
      const container = document.getElementById("legalContent");
      if (s && s.privacy_content) {
        container.innerHTML = s.privacy_content;
      } else {
        container.innerHTML = '<p>No hay contenido disponible.</p>';
      }
    })();
  </script>
</body>

</html>
