<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Usuarios | Café Cortero</title>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="/css/core/tipografia.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/ui/header.css" />
  <link rel="stylesheet" href="/css/ui/header.search.css" />
  <link rel="stylesheet" href="/css/admin/admin-usuarios.css" />
  <link rel="icon" type="image/png" href="/imagenes/logo.png">

  <!-- Configuración de UI -->
  <script>
    window.PAGE_MODE = "admin-usuarios";
  </script>
</head>

<body class="page-admin-users">
  <!-- El header se inyecta dinámicamente aquí por layout.js -->

  <main class="admin-users-container fade-in">

    <!-- Encabezado Editorial (Stitch Style) -->
    <header class="page-title-section">
        <div class="title-content">
            <h1 class="page-title">Directorio de Personal y Usuarios</h1>
            <p class="page-subtitle">Gestión centralizada de Usuarios, roles y permisos.</p>
        </div>
        <div class="header-actions">
            <button class="btn-primary" id="btnNewUser">
                <span class="material-symbols-outlined">person_add</span>
                Nuevo Colaborador
            </button>
        </div>
    </header>

    <!-- Lista de Personal (Label Decorativa) -->
    <div class="section-label">
        <h2 class="label-text">Gestion de Usuarios</h2>
        <div class="label-underline"></div>
    </div>

    <!-- Matriz de Usuarios (Directorio) -->
    <section class="users-matrix-wrapper">
        <div class="users-table-container">
            <table class="users-table" id="users-table">
                <thead>
                    <tr>
                        <th>USUARIO</th>
                        <th>EMAIL</th>
                        <th>ROL ASIGNADO</th>
                        <th>UBICACIÓN / PAÍS</th>
                        <th class="actions-col"></th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <!-- Se llena vía JavaScript -->
                </tbody>
            </table>
            
            <!-- Loading State -->
            <div id="loading-users" class="loading-state">
                <div class="spinner"></div>
                <p>Consultando el libro de registros...</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state hidden">
                <span class="material-symbols-outlined">group_off</span>
                <p>No se encontraron usuarios con esos criterios.</p>
            </div>

            <!-- Footer de Paginación (Pied de página de la tabla) -->
            <footer class="matrix-footer">
                <div class="pagination-controls">
                    <button class="page-btn" id="prev-page" title="Anterior">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <div id="page-numbers" class="page-numbers">
                        <!-- Generado vía JS -->
                    </div>
                    <button class="page-btn" id="next-page" title="Siguiente">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
                <p id="page-info" class="page-info">Mostrando página 1 de 1</p>
            </footer>
        </div>
    </section>

  </main>

  <!-- Scripts Core -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/ui/layout.js"></script>
  <script type="module" src="/js/ui/header.js"></script>

  <!-- Inyección del Buscador en Header -->
  <script type="module">
    import { renderHeaderSearch } from "/js/ui/header.search.js";

    document.addEventListener("header:ready", () => {
      const slot = document.getElementById("header-search-slot");
      if (slot) {
        slot.innerHTML = renderHeaderSearch({
          showFilter: true,
          showAdd: false,
          placeholder: "Nombre, email o cargo..."
        });
        
        // --- 1. Configurar Filtro por Rol (Drop-down del Header) ---
        const filter = document.getElementById("header-status-filter");
        if (filter) {
            filter.innerHTML = `
                <option value="all">Todos los Roles</option>
                <option value="admin">Administradores</option>
                <option value="moderator">Moderadores</option>
                <option value="user">Usuarios</option>
            `;
            filter.addEventListener("change", (e) => {
                // Sincronizar con el select nativo de la página (opcional pero bueno para consistencia)
                const pageFilter = document.getElementById("filter-role");
                if (pageFilter) {
                    pageFilter.value = e.target.value;
                }
                // Disparar evento para que admin-usuarios.js reaccione
                document.dispatchEvent(new CustomEvent("user:filter", { detail: e.target.value }));
            });
        }

        // --- 2. Sincronizar Búsqueda (Input del Header) ---
        const headerInput = document.getElementById("header-search-input");
        if (headerInput) {
          headerInput.addEventListener("input", (e) => {
            document.dispatchEvent(new CustomEvent("user:search", { detail: e.target.value.trim() }));
          });
        }
      }
    });
  </script>

  <!-- Lógica de la Página -->
  <script src="/js/admin/admin-usuarios.js" type="module"></script>
</body>

</html>
