<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Usuarios | Café Cortero</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/core/tipografia.css">
  <link rel="stylesheet" href="/css/ui/header.css">
  <link rel="stylesheet" href="/css/ui/header.search.css">
  <link rel="stylesheet" href="/css/admin/admin-usuarios.css">
  <link rel="icon" type="image/png" href="/imagenes/logo.png">
</head>
<body class="bg-[#F8FAF9]">
  <div id="header-placeholder"></div>

  <main class="admin-users-container">
    <header class="page-header-institucional">
      <h1 class="page-title-institucional">Directorio de Personal y Usuarios</h1>
      <p class="page-subtitle-institucional">Gestión centralizada de Usuarios, roles y permisos.</p>
    </header>

    <div class="section-header-institucional">
        <h2 class="section-title-institucional">Gestion de Usuarios</h2>
        <div class="green-line-stitch"></div>
    </div>

    <div class="main-card">
        <div class="data-container">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>USUARIO</th>
                        <th>EMAIL</th>
                        <th>ROL ASIGNADO</th>
                        <th>UBICACIÓN / PAÍS</th>
                        <th class="text-right"></th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
            
            <div id="users-mobile-list" class="users-mobile-list"></div>

            <footer class="pagination-institucional">
                <p id="page-info" class="page-info">MOSTRANDO 0 DE 0 REGISTROS</p>
                <div class="pagination-controls-institucional">
                    <button class="page-btn-icon" id="prev-page"><span class="material-symbols-outlined">chevron_left</span></button>
                    <div id="page-numbers" class="page-numbers-institucional"></div>
                    <button class="page-btn-icon" id="next-page"><span class="material-symbols-outlined">chevron_right</span></button>
                </div>
            </footer>
        </div>
    </div>
  </main>
  <button class="fab-btn" id="fabNewUser" onclick="const b=document.getElementById('btnNewUser'); if(b) b.click();"><span class="material-symbols-outlined">person_add</span></button>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/ui/layout.js"></script>
  <script type="module" src="/js/ui/header.js"></script>
  <script type="module">
    import { renderHeaderSearch } from "/js/ui/header.search.js";
    document.addEventListener("header:ready", () => {
      const slot = document.getElementById("header-search-slot");
      if (!slot) return;
      slot.innerHTML = renderHeaderSearch({ showFilter: true, showAdd: false, placeholder: "Nombre, email o cargo..." });
      const f = document.getElementById("header-status-filter");
      if (f) {
        f.innerHTML = `<option value="all">TODOS LOS ROLES</option><option value="admin">ADMINISTRADORES</option><option value="moderator">MODERADORES</option><option value="user">USUARIOS</option>`;
        f.addEventListener("change", (e) => {
          const pf = document.getElementById("filter-role");
          if (pf) pf.value = e.target.value;
          document.dispatchEvent(new CustomEvent("user:filter", { detail: e.target.value }));
        });
      }
      const hi = document.getElementById("header-search-input");
      if (hi) {
        hi.addEventListener("input", (e) => {
          document.dispatchEvent(new CustomEvent("user:search", { detail: e.target.value.trim() }));
        });
      }
    });
  </script>
  <script src="/js/admin/admin-usuarios.js" type="module"></script>
</body>
</html>
