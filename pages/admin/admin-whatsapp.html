<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · WhatsApp | Café Cortero</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="/css/core/tipografia.css" />
  <link rel="stylesheet" href="/css/ui/header.css" />
  <link rel="stylesheet" href="/css/admin/admin-whatsapp.css" />
</head>

<body class="page-admin-whatsapp">

  <main class="wa-layout fade-in">

    <div class="wa-body">

      <!-- Sidebar: Lista de clientes -->
      <aside class="wa-sidebar">
        <div class="wa-sidebar-header">
          <span class="material-symbols-outlined">groups</span>
          <strong>Clientes</strong>
          <span class="wa-count" id="contacts-count">0</span>
        </div>
        <div class="wa-search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="wa-search" placeholder="Buscar cliente..." />
        </div>
        <div class="wa-contacts-list" id="contacts-list">
          <div class="wa-loading">Cargando clientes...</div>
        </div>
      </aside>

      <!-- Panel: Chat -->
      <section class="wa-panel" id="wa-panel">
        <div class="wa-no-selection" id="wa-no-selection">
          <span class="material-symbols-outlined" style="font-size: 64px; color: #ccc;">chat</span>
          <p>Selecciona un cliente para enviarle un mensaje</p>
        </div>

        <div class="wa-chat hidden" id="wa-chat">
          <header class="wa-chat-header">
            <button id="wa-back-btn" class="wa-back-btn mobile-only">
              <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div class="wa-chat-avatar" id="chat-avatar">
              <span class="material-symbols-outlined">person</span>
            </div>
            <div class="wa-chat-info">
              <strong id="chat-name">—</strong>
              <span id="chat-phone">—</span>
            </div>
          </header>

          <div class="wa-chat-history" id="chat-history">
            <div class="wa-history-placeholder">
              <span class="material-symbols-outlined">history</span>
              <p>No hay mensajes previos. Envía el primer mensaje.</p>
            </div>
          </div>

          <div class="wa-chat-input-area">
            <textarea id="wa-message-input" placeholder="Escribe tu mensaje aquí..." rows="2" maxlength="500"></textarea>
            <button id="wa-send-btn" class="wa-send-btn">
              <span class="material-symbols-outlined">send</span>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="snackbar" class="snackbar"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/core/supabase-auth.js"></script>
  <script>window.PAGE_MODE = "admin-whatsapp";</script>
  <script type="module" src="/js/ui/header.js"></script>
  <script src="/js/core/auth-ui.js"></script>
  <script src="/js/ui/layout.js"></script>
  <script src="/js/admin/admin-whatsapp.js"></script>
</body>
</html>
