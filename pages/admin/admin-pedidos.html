<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin · Pedidos | Café Cortero</title>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="../../css/tipografia.css" />
  <link rel="stylesheet" href="../../css/header.css" />
  <link rel="stylesheet" href="../../css/admin/admin-pedidos.css" />
</head>

<body class="page-admin-pedidos">

<main class="admin-orders-container fade-in">

<!-- =========================
     BARRA SUPERIOR (BUSCAR + FILTRO)
========================= -->
<section class="orders-actions-bar">
  <div class="search-box has-filter">

    <span class="material-symbols-outlined search-icon">search</span>

    <input
      type="search"
      id="search-orders"
      placeholder="Buscar pedido, cliente, correo o teléfono"
    />

    <select id="status-filter" class="status-filter">
      <option value="new">Nuevos</option>
      <option value="processing">En preparación</option>
      <option value="shipped">Enviados</option>
      <option value="delivered">Entregados</option>
      <option value="all">Todos</option>
    </select>

  </div>
</section>

<!-- =========================
     ESTADO VACÍO
========================= -->
<section id="admin-empty-state" class="admin-empty-state hidden">
  <h2 class="empty-title">No hay pedidos</h2>
  <p class="empty-text">
    Cuando los clientes realicen pedidos, aparecerán aquí.
  </p>
</section>

<!-- =========================
     TARJETA PRINCIPAL — PEDIDO
========================= -->
<section id="admin-order-preview" class="order-main admin-preview hidden">

  <!-- BOTÓN ATRÁS -->
  <button class="back-btn" id="btnBackOrders" aria-label="Volver">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>

  <!-- ================= INFO ================= -->
  <div class="order-text">

    <!-- HEADER -->
    <div class="order-header">
      <h2 id="o-number">Pedido N.º —</h2>
      <span id="o-date" class="order-date">—</span>
      <strong id="o-total" class="order-total">L 0.00</strong>
    </div>

    <!-- CLIENTE -->
    <section class="order-client">
      <h3>Cliente</h3>
      <p id="o-client-name">—</p>
      <p class="client-meta">
        <span><i class="material-symbols-outlined">mail</i> <span id="o-email">—</span></span>
        <span><i class="material-symbols-outlined">call</i> <span id="o-phone">—</span></span>
      </p>
    </section>

    <!-- DIRECCIÓN -->
    <section class="order-address">
      <h3>Entrega</h3>
      <p id="o-address">—</p>
      <p class="reference">
        <strong>Referencia:</strong>
        <span id="o-reference">—</span>
      </p>
    </section>

    <!-- PAGO -->
    <section class="order-payment">

      <!-- PAGO CONTRA ENTREGA -->
      <div id="cash-payment" class="payment-info hidden">
        <span class="material-symbols-outlined">payments</span>
        Pago contra entrega
      </div>

      <!-- RECIBO -->
      <div id="receipt-payment" class="payment-receipt hidden">
        <img id="receipt-img" src="" alt="Recibo de pago">
        <span>Recibo adjunto</span>
      </div>

    </section>

    <!-- ACCIONES -->
    <div class="order-actions">

      <button id="btnViewOrder" class="admin-action-btn">
        <span class="material-symbols-outlined">receipt_long</span>
        Ver información
      </button>

      <div class="status-actions">
        <button id="btnShip" class="admin-action-btn ship">
          <span class="material-symbols-outlined">local_shipping</span>
          Marcar enviado
        </button>

        <button id="btnDeliver" class="admin-action-btn deliver">
          <span class="material-symbols-outlined">done_all</span>
          Marcar entregado
        </button>
      </div>

    </div>

  </div>
</section>

<!-- =========================
     CARRUSEL DE PEDIDOS
========================= -->
<section class="related admin-related hidden">

  <h3 class="similar-title">Pedidos</h3>
  <p class="section-subtitle">
    Selecciona un pedido para gestionarlo.
  </p>

  <div class="carousel-container with-arrows">

    <button class="carousel-prev-circle inside" id="orders-prev">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <div class="similar-list" id="orders-carousel">
      <!-- JS renderiza pedidos -->
    </div>

    <button class="carousel-next-circle inside" id="orders-next">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>

  </div>
</section>

</main>

<!-- =========================
     TEMPLATE PEDIDO (CARRUSEL)
========================= -->
<template id="tpl-order-card">
  <article class="similar-card order-card" data-id="">
    <h4 class="o-card-number">Pedido N.º 000</h4>
    <p class="o-card-total">L 0.00</p>
    <span class="o-card-status">—</span>
  </article>
</template>

<!-- =========================
     SCRIPTS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/core/supabase-client-core.js"></script>

<script>
  window.PAGE_MODE = "admin-pedidos";
</script>

<script type="module" src="../../js/ui/header.js"></script>
<script src="../../js/core/auth-ui.js"></script>
<script src="../../js/ui/layout.js"></script>

<script src="../../js/admin/admin_pedidos.js"></script>

</body>
</html>
