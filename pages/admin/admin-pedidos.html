<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Pedidos | Café Cortero</title>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="/css/core/tipografia.css" />
  <link rel="stylesheet" href="/css/ui/header.css" />
  <link rel="stylesheet" href="/css/ui/header.search.css">
  <link rel="stylesheet" href="/css/admin/admin-pedidos.css" />
  <link rel="icon" type="image/png" href="/imagenes/logo.png">
</head>

<body class="page-admin-pedidos">
  <main class="admin-orders-container fade-in">

    <!-- =========================
     BARRA SUPERIOR
========================= -->


    <!-- =========================
     ESTADO VACÍO
========================= -->
    <section id="admin-empty-state" class="admin-empty-state hidden">
      <h2 class="empty-title">No hay pedidos</h2>
      <p class="empty-text">
        Cuando los clientes realicen pedidos, aparecerán aquí.
      </p>
    </section>

    <!-- =========================
     PREVIEW PEDIDO
========================= -->
    <section id="admin-order-preview" class="order-main admin-preview hidden">

      <!-- HEADER (flecha arriba, pedido abajo) -->
      <header class="order-preview-header stacked-header">

        <!-- FLECHA ARRIBA -->
        <button class="back-btn" onclick="location.href='/pages/home/index.html'" id="btnBackOrders" type="button">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>

        <!-- PEDIDO DEBAJO -->
        <div class="order-header-text">
          <h2 id="o-number">Pedido N.º —</h2>
          <span id="o-date" class="order-date">—</span>
        </div>

        <!-- ESTADO OCULTO (solo para JS, no UI) -->
        <span id="o-status" class="status-chip" hidden></span>

      </header>
      <!-- CONTENIDO -->
      <div class="order-layout">

        <!-- COLUMNA TEXTO -->
        <div class="order-text">

          <!-- CLIENTE -->
          <section class="order-client">
            <h3>Cliente</h3>
            <p id="o-client-name" class="client-name">—</p>

            <div class="client-meta-vertical">
              <div class="meta-row">
                <span class="material-symbols-outlined">call</span>
                <span id="o-phone">—</span>
              </div>
              <div class="meta-row">
                <span class="material-symbols-outlined">mail</span>
                <span id="o-email">—</span>
              </div>
            </div>
          </section>

          <!-- PRODUCTOS -->
          <div id="order-items-pills" class="order-pills order-summary"></div>

          <!-- TOTAL -->
          <div class="order-total order-summary">
            <span>Total del pedido</span>
            <strong id="o-total">L 0.00</strong>
          </div>

          <p id="o-zone" class="order-zone">Zona —</p>

          <!-- ENTREGA -->
          <section class="order-address">
            <h3>Entrega</h3>
            <p id="o-address">—</p>
            <p class="reference">
              <strong>Referencia:</strong>
              <span id="o-reference">—</span>
            </p>
          </section>

          <!-- ACCIONES EN LÍNEA -->
          <section class="order-actions inline-actions">

            <button id="btnAccept" class="admin-action-btn accept hidden">
              <span class="material-symbols-outlined">hourglass_top</span>
              Pasar a preparación
            </button>

            <button id="btnReject" class="admin-action-btn reject hidden">
              <span class="material-symbols-outlined">cancel</span>
              Cancelar pedido
            </button>

            <button id="btnShip" class="admin-action-btn ship hidden">
              <span class="material-symbols-outlined">local_shipping</span>
              Marcar como enviado
            </button>

            <button id="btnDeliver" class="admin-action-btn deliver hidden">
              <span class="material-symbols-outlined">done_all</span>
              Marcar como entregado
            </button>

          </section>
        </div>

        <!-- COLUMNA MEDIA -->
        <div id="order-media" class="order-media hidden">

          <div id="receipt-payment" class="payment-media hidden">
            <img id="receipt-img" alt="Recibo de pago" loading="lazy" />
          </div>

          <div id="cash-payment" class="payment-media placeholder hidden">
            <img src="/imagenes/pago_en_mano.svg" alt="Pago contra entrega" />
            <p>Pago contra entrega</p>
          </div>

        </div>

      </div>
    </section>

    <!-- =========================
     CARRUSEL
========================= -->
    <section class="related admin-related hidden">
      <h3 class="similar-title">Pedidos</h3>
      <p class="section-subtitle">
        Selecciona un pedido para gestionarlo.
      </p>

      <div class="carousel-container with-arrows">
        <button class="carousel-prev-circle inside" id="orders-prev">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>

        <div class="similar-list" id="orders-carousel"></div>

        <button class="carousel-next-circle inside" id="orders-next">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
    </section>

  </main>

  <!-- =========================
     TEMPLATE CARD
========================= -->
  <template id="tpl-order-card">
    <article class="similar-card order-card">
      <div class="order-card-media">
        <img class="order-card-img hidden" alt="Recibo" loading="lazy" />
        <div class="order-card-placeholder hidden">
          <img src="/imagenes/pago_en_mano.svg" alt="Pago contra entrega" />
          <p>Pago contra entrega</p>
        </div>
      </div>

      <div class="order-card-info">
        <h4 class="o-card-number">Pedido N.º 000</h4>
        <p class="o-card-total">L 0.00</p>
        <span class="o-card-status">—</span>
      </div>
    </article>
  </template>

  <!-- =========================
     SNACKBAR
========================= -->
  <div id="snackbar-action" class="snackbar-action hidden">
    <div class="snackbar-content">
      <div class="snackbar-text">
        <strong id="snackbar-title">—</strong>
        <span id="snackbar-message">—</span>
      </div>

      <div class="snackbar-actions">
        <button id="snackbar-cancel" class="snackbar-btn cancel">Cancelar</button>
        <button id="snackbar-confirm" class="snackbar-btn danger">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- =========================
     SCRIPTS CORE
========================= -->

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/core/supabase-client-core.js"></script>

<!-- Modo de página (ANTES del layout) -->
<script>
  window.PAGE_MODE = "admin-pedidos";
</script>

<!-- Layout (inyecta el HEADER en #app-header) -->
<script src="/js/ui/layout.js"></script>

<!-- Header core -->
<script type="module" src="/js/ui/header.js"></script>

<!-- 🔍 Buscador global del header — ADMIN PEDIDOS -->
<script type="module">
  import { renderHeaderSearch } from "/js/ui/header.search.js";

  document.addEventListener("header:ready", () => {
    const slot = document.getElementById("header-search-slot");

    if (!slot) {
      console.warn("❌ header-search-slot no encontrado");
      return;
    }

    /* ===============================
       INYECTAR BUSCADOR
    =============================== */
    slot.innerHTML = renderHeaderSearch({
      showFilter: true,
      showAdd: false
    });

    /* ===============================
       ESTADO INICIAL → NUEVOS
    =============================== */
    const DEFAULT_STATUS = "new";

    document.dispatchEvent(
      new CustomEvent("header:filter", {
        detail: DEFAULT_STATUS
      })
    );

    /* ===============================
       🔍 BÚSQUEDA GLOBAL
    =============================== */
    const input = document.getElementById("header-search-input");
    if (input) {
      input.addEventListener("input", (e) => {
        document.dispatchEvent(
          new CustomEvent("header:search", {
            detail: e.target.value.trim()
          })
        );
      });
    }

    /* ===============================
       🎯 FILTRO POR ESTADO
    =============================== */
    const filter = document.getElementById("header-status-filter");
    if (filter) {
      filter.value = DEFAULT_STATUS;
      filter.addEventListener("change", (e) => {
        document.dispatchEvent(
          new CustomEvent("header:filter", {
            detail: e.target.value
          })
        );
      });
    }

    console.log("🔍 Buscador del header listo (Admin pedidos)");
  });
</script>

<!-- Auth UI (opcional pero correcto aquí) -->
<script src="/js/core/auth-ui.js"></script>

<!-- ADMIN PEDIDOS (AL FINAL SIEMPRE) -->
<script src="/js/admin/admin_pedidos.js"></script>
</body>

</html>
