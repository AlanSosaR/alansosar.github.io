<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pedidos | Administración — Café Cortero</title>

  <!-- Tipografía -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500&display=swap"
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="../../css/header.css" />
  <link rel="stylesheet" href="../../css/admin/admin-pedidos.css" />
</head>

<body class="page-admin page-admin-pedidos">

<main class="admin-container fade-in">

  <!-- =========================
       CABECERA
  ========================= -->
  <header class="admin-page-header">
    <h1>Pedidos</h1>
    <p>Gestiona y controla los pedidos de los clientes</p>
  </header>

  <!-- =========================
       CONTROLES UNIFICADOS
  ========================= -->
  <section class="admin-controls unified">

    <div class="search-filter-bar">

      <div class="search-group">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="search"
          id="admin-orders-search"
          placeholder="Buscar pedido, cliente, correo o teléfono"
        />
      </div>

      <div class="filter-group">
        <select id="status-filter">
          <option value="new">Nuevos</option>
          <option value="processing">En preparación</option>
          <option value="shipped">Enviados</option>
          <option value="delivered">Entregados</option>
          <option value="all">Todos</option>
        </select>
      </div>

    </div>

  </section>

  <!-- =========================
       LISTA DE PEDIDOS
  ========================= -->
  <section class="admin-orders-list" id="pedidos-lista">

    <!-- ================= TEMPLATE ================= -->
    <template id="pedido-template">
      <article class="admin-order-card">

        <!-- HEADER -->
        <header class="order-header">
          <div>
            <h3 class="pedido-numero">Pedido N.º 000</h3>
            <span class="order-date">—</span>
          </div>

          <span class="order-total">L 0.00</span>
        </header>

        <!-- CLIENTE -->
        <section class="order-client">
          <p class="client-name">Nombre del cliente</p>
          <p class="client-meta">
            <span><i class="fa-solid fa-envelope"></i> correo@email.com</span>
            <span><i class="fa-solid fa-phone"></i> 0000-0000</span>
          </p>
        </section>

        <!-- DIRECCIÓN -->
        <section class="order-address">
          <p>
            <i class="fa-solid fa-location-dot"></i>
            <span class="direccion-text">Dirección completa</span>
          </p>
          <p class="referencia-text">
            <strong>Referencia:</strong> —
          </p>
        </section>

        <!-- PAGO -->
        <section class="order-payment">

          <!-- CONTRA ENTREGA -->
          <div class="payment-badge cash hidden">
            <span class="material-symbols-outlined">payments</span>
            Pago contra entrega
          </div>

          <!-- RECIBO -->
          <div class="payment-receipt hidden">
            <img src="" alt="Recibo de pago" class="receipt-thumb" />
            <span>Recibo adjunto</span>
          </div>

        </section>

        <!-- ACCIONES -->
        <footer class="order-actions">

          <button class="btn-outline btn-view">
            <span class="material-symbols-outlined">receipt_long</span>
            Ver información
          </button>

          <div class="order-status-actions">
            <button class="btn-outline btn-ship">
              <span class="material-symbols-outlined">local_shipping</span>
              Marcar enviado
            </button>

            <button class="btn-outline btn-deliver">
              <span class="material-symbols-outlined">done_all</span>
              Marcar entregado
            </button>
          </div>

        </footer>

      </article>
    </template>

  </section>

  <!-- =========================
       PAGINACIÓN
  ========================= -->
  <div id="pagination-container"></div>

  <!-- =========================
       EMPTY STATE
  ========================= -->
  <section id="empty-state" class="empty-state hidden">
    <h2>No hay pedidos</h2>
    <p>Cuando los clientes realicen pedidos, aparecerán aquí.</p>
  </section>

</main>

<!-- =========================
     SCRIPTS
========================= -->

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CORE -->
<script src="../../js/core/supabase-client-core.js"></script>

<script>
  window.PAGE_MODE = "admin-pedidos";
</script>

<!-- UI -->
<script type="module" src="../../js/ui/header.js"></script>
<script src="../../js/core/auth-ui.js"></script>
<script src="../../js/ui/layout.js"></script>

<!-- ADMIN -->
<script src="../../js/admin/admin_pedidos.js"></script>

</body>
</html>
