<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pedidos | Administración — Café Cortero</title>

  <!-- Tipografía -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500&display=swap"
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="../../css/header.css" />
  <link rel="stylesheet" href="../../css/admin/admin-pedidos.css" />
</head>

<body class="page-admin page-admin-pedidos">

<main class="admin-container fade-in">

  <!-- =========================
       CABECERA
  ========================= -->
  <header class="admin-page-header">
    <h1>Pedidos</h1>
    <p>Gestiona y controla los pedidos de los clientes</p>
  </header>

  <!-- =========================
       CONTROLES
  ========================= -->
  <section class="admin-controls">

    <div class="filter-group">
      <label for="status-filter">Estado</label>
      <select id="status-filter">
        <option value="new">Nuevos</option>
        <option value="processing">En preparación</option>
        <option value="shipped">Enviados</option>
        <option value="delivered">Entregados</option>
        <option value="all">Todos</option>
      </select>
    </div>

    <div class="search-group">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        type="search"
        id="admin-orders-search"
        placeholder="Buscar por pedido, cliente o teléfono"
      />
    </div>

  </section>

  <!-- =========================
       LISTA DE PEDIDOS
  ========================= -->
  <section class="admin-orders-list" id="pedidos-lista">

    <template id="pedido-template">
      <article class="admin-order-card">

        <header class="order-header">
          <h3 class="pedido-numero">Pedido N.º 000</h3>
          <span class="order-date">—</span>
        </header>

        <section class="order-client">
          <p class="client-name">—</p>
          <p class="client-meta"></p>
        </section>

        <section class="order-status">
          <span class="material-symbols-outlined">autorenew</span>
          <span class="status-text">—</span>
        </section>

        <section class="order-summary">
          <span>—</span>
          <strong>—</strong>
        </section>

        <footer class="order-actions">
          <button class="btn-outline">
            <span class="material-symbols-outlined">local_shipping</span>
            Marcar enviado
          </button>

          <button class="btn-outline">
            <span class="material-symbols-outlined">done_all</span>
            Marcar entregado
          </button>
        </footer>

      </article>
    </template>

  </section>

  <!-- =========================
       PAGINACIÓN
  ========================= -->
  <div id="pagination-container"></div>

  <!-- =========================
       EMPTY STATE
  ========================= -->
  <section id="empty-state" class="empty-state hidden">
    <h2>No hay pedidos</h2>
    <p>Cuando los clientes realicen pedidos, aparecerán aquí.</p>
  </section>

</main>

<!-- =========================
     SCRIPTS (ORDEN CORRECTO)
========================= -->

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CORE -->
<script src="../../js/core/supabase-client-core.js"></script>

<script>
  window.PAGE_MODE = "admin-pedidos";
</script>

<!-- UI -->
<script type="module" src="../../js/ui/header.js"></script>
<script src="../../js/core/auth-ui.js"></script>
<script src="../../js/ui/layout.js"></script>

<!-- ADMIN -->
<script src="../../js/admin/admin_pedidos.js"></script>

</body>
</html>
