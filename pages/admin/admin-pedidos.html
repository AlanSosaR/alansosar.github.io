<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mis pedidos | Café Cortero</title>

  <!-- Tipografía -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
  />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/mis-pedidos.css" />
</head>

<body class="page-mis-pedidos header-checkout">

<main class="admin-orders-container fade-in">

  <!-- =========================
       PREVIEW PEDIDO (MIS PEDIDOS)
  ========================== -->
  <section id="pedido-activo" class="order-main admin-preview hidden">
    <!-- JS render -->
  </section>

  <!-- =========================
       EMPTY
  ========================== -->
  <section id="empty-state" class="admin-empty-state hidden">
    <h2 class="empty-title">No tienes pedidos</h2>
    <p class="empty-text">
      Cuando realices un pedido, aparecerá aquí.
    </p>
  </section>

  <!-- =========================
       CARRUSEL
  ========================== -->
  <section class="related admin-related hidden">
    <h3 class="similar-title">Mis pedidos</h3>
    <p class="section-subtitle">
      Selecciona un pedido para ver su detalle.
    </p>

    <div class="carousel-container with-arrows">
      <button class="carousel-prev-circle inside" id="pedidos-prev">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>

      <div class="similar-list" id="pedidos-carrusel"></div>

      <button class="carousel-next-circle inside" id="pedidos-next">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </section>

</main>

<!-- =========================
     TEMPLATE — PEDIDO ACTIVO
========================= -->
<template id="pedido-activo-template">
<section class="order-main admin-preview">

  <!-- HEADER -->
  <header class="order-preview-header stacked-header">
    <div class="order-header-text">
      <h2 class="pedido-numero">Pedido N.º 000</h2>
      <span class="pedido-fecha">
        <span class="fecha"></span> · <span class="hora"></span>
      </span>
    </div>
  </header>

  <!-- CONTENIDO -->
  <div class="order-layout">

    <!-- TEXTO -->
    <div class="order-text">

      <!-- PRODUCTOS -->
      <div class="order-pills order-summary productos-pills"></div>

      <div class="order-total order-summary">
        <span>Total del pedido</span>
        <strong class="pedido-total">L 0.00</strong>
      </div>

      <!-- ENTREGA -->
      <section class="order-address">
        <h3>Entrega</h3>
        <p class="entrega-text">—</p>
        <p class="reference">
          <strong>Referencia:</strong>
          <span class="referencia-text">—</span>
        </p>
      </section>

      <!-- ESTADO -->
      <section class="pedido-estado">
        <h3>Estado del pedido</h3>

        <p class="estado-resumen">
          Paso <span class="estado-paso"></span> de 4 ·
          <strong class="estado-nombre"></strong>
        </p>

        <ul class="estado-list">
          <li class="estado-item" data-estado="pagado">
            <span class="dot">1</span><span class="label">Pagado</span>
          </li>
          <li class="estado-item" data-estado="revision">
            <span class="dot">2</span><span class="label">Revisión</span>
          </li>
          <li class="estado-item" data-estado="confirmado">
            <span class="dot">3</span><span class="label">Confirmado</span>
          </li>
          <li class="estado-item" data-estado="envio">
            <span class="dot">4</span><span class="label">Envío</span>
          </li>
        </ul>

        <p class="estado-descripcion"></p>
      </section>

    </div>

    <!-- MEDIA -->
    <div class="order-media">

      <div class="payment-media receipt hidden">
        <img class="recibo-img" alt="Recibo de pago" />
        <p class="recibo-label"></p>
      </div>

      <div class="payment-media placeholder hidden">
        <img src="imagenes/pago_en_mano.svg" alt="Pago contra entrega" />
        <p>Pago contra entrega</p>
      </div>

      <button class="ver-recibo">
        Ver recibo
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>

    </div>

  </div>
</section>
</template>

<!-- =========================
     TEMPLATE — CARD CARRUSEL
========================= -->
<template id="pedido-carrusel-template">
  <article class="similar-card pedido-mini-card">
    <div class="order-card-media">
      <img class="pedido-mini-img" />
    </div>

    <div class="order-card-info">
      <h4 class="pedido-mini-numero"></h4>
      <p class="pedido-mini-total"></p>
      <span class="pedido-mini-status"></span>
    </div>
  </article>
</template>

<!-- =========================
     SCRIPTS
========================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/supabase-client-core.js"></script>
<script src="js/core/supabase-auth.js"></script>
<script src="js/core/auth-ui.js"></script>
<script src="js/ui/layout.js"></script>
<script type="module" src="js/ui/header.js"></script>
<script type="module" src="js/pages/mis-pedidos.js"></script>

</body>
</html>
