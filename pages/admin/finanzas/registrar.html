<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Nuevo Registro | Café Cortero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/imagenes/logo.png">

  <link rel="stylesheet" href="/css/core/tipografia.css">
  <link rel="stylesheet" href="/css/ui/header.css">
  <link rel="stylesheet" href="/css/finanzas.css">
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
    .page-fin-unified-registro .fin-saldo-card {
      margin-top: 24px;
      padding-left: 56px;
    }
  </style>
</head>
<body class="finanzas-page page-fin-unified-registro">
  <div id="header-placeholder"></div>

  <main class="fin-page">

    <!-- TOP APP BAR -->
    <header class="fin-top-app-bar">
      <button class="fin-back-btn" onclick="window.location.href='/pages/admin/finanzas/index.html'">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h1 class="fin-title" style="flex:1;">Nuevo Registro</h1>
      <button class="fin-icon-btn" aria-label="Notificaciones">
        <span class="material-symbols-outlined">notifications</span>
      </button>
    </header>

    <div class="fin-content">

      <!-- HERO CANTIDAD -->
      <div class="fin-saldo-card-wrapper">
        <button onclick="window.location.href='/pages/admin/finanzas/index.html'" class="fin-notch-btn">
          &#x276E;
        </button>
        <section class="fin-saldo-card">
          <div class="fin-hero-label">¿Cuánto vas a registrar?</div>
          <div class="fin-hero-input-wrap">
            <span style="flex-shrink:0;"><span id="fin-hnl-label" style="color:var(--marron);font-weight:600;font:var(--md-display-lg);font-size:clamp(24px, 6vw, 48px);">HNL</span></span>
            <input type="text" id="fin-monto-input" inputmode="decimal" placeholder="0,000.00" value="0.00"
              class="fin-hero-input">
          </div>
        </section>
      </div>

      <!-- TIPO DE MOVIMIENTO -->
      <section style="margin-bottom:16px;">
        <p style="font:var(--md-title-md);color:var(--md-on-surface);font-weight:600;margin-bottom:12px;">Tipo de Movimiento</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" id="tipo-toggle">
          <button class="fin-tipo-btn active primary" data-tipo="ingreso">
            <span class="material-symbols-outlined" style="font-size:32px;">trending_up</span>
            <span style="font:var(--md-title-md);font-weight:700;">Ingreso</span>
          </button>
          <button class="fin-tipo-btn" data-tipo="egreso">
            <span class="material-symbols-outlined" style="font-size:32px;">trending_down</span>
            <span style="font:var(--md-title-md);">Gasto</span>
          </button>
        </div>
      </section>

      <!-- FORM CARD -->
      <section class="fin-form-card">

        <!-- CATEGORÍA -->
          <div class="fin-cat-dropdown" id="fin-categoria-chips">
            <span class="fin-cat-floating-label">Categoría</span>
            <button class="fin-cat-dropdown-trigger" id="fin-cat-trigger" type="button">
              <span class="fin-cat-trigger-content">
                <span class="material-symbols-outlined fin-cat-trigger-icon">category</span>
                <span class="fin-cat-trigger-label fin-cat-trigger-placeholder">Seleccionar categoría</span>
              </span>
              <span class="material-symbols-outlined fin-cat-trigger-arrow">arrow_drop_down</span>
            </button>
            <div class="fin-cat-dropdown-menu" id="fin-cat-menu"></div>
            <div id="acciones-categoria" style="display:flex;gap:8px;margin-top:8px;"></div>
          </div>

        <!-- CAMPOS DE CAFÉ (CANTIDAD Y PRECIO POR LIBRA) -->
        <section style="margin-bottom:16px;display:none;" id="fin-cafe-fields">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="fin-field">
              <div class="fin-input-wrapper">
                <span class="material-symbols-outlined fin-input-icon">weight</span>
                <input type="text" id="fin-cantidad-libras" inputmode="decimal" placeholder="0.00">
                <label class="fin-field-label">Cantidad de libras</label>
              </div>
            </div>
            <div class="fin-field">
              <div class="fin-input-wrapper">
                <span class="material-symbols-outlined fin-input-icon">attach_money</span>
                <input type="text" id="fin-precio-libra" inputmode="decimal" placeholder="0.00">
                <label class="fin-field-label">Precio por libra (HNL)</label>
              </div>
            </div>
          </div>
        </section>

        <!-- CAMPOS DE FINCA LA ROSA -->
        <section style="margin-bottom:16px;display:none;" id="fin-finca-fields">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="fin-cat-dropdown" id="fin-presentacion-dropdown">
              <span class="fin-cat-floating-label">Presentación</span>
              <button class="fin-cat-dropdown-trigger" id="fin-presentacion-trigger" type="button">
                <span class="fin-cat-trigger-content">
                  <span class="material-symbols-outlined fin-cat-trigger-icon">inventory</span>
                  <span class="fin-cat-trigger-label fin-cat-trigger-placeholder">Seleccionar</span>
                </span>
                <span class="material-symbols-outlined fin-cat-trigger-arrow">arrow_drop_down</span>
              </button>
              <div class="fin-cat-dropdown-menu" id="fin-presentacion-menu"></div>
            </div>
            <div class="fin-cat-dropdown" id="fin-tipo-cafe-dropdown">
              <span class="fin-cat-floating-label">Tipo de café</span>
              <button class="fin-cat-dropdown-trigger" id="fin-tipo-cafe-trigger" type="button">
                <span class="fin-cat-trigger-content">
                  <span class="material-symbols-outlined fin-cat-trigger-icon">coffee</span>
                  <span class="fin-cat-trigger-label fin-cat-trigger-placeholder">Seleccionar</span>
                </span>
                <span class="material-symbols-outlined fin-cat-trigger-arrow">arrow_drop_down</span>
              </button>
              <div class="fin-cat-dropdown-menu" id="fin-tipo-cafe-menu"></div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
            <div class="fin-field">
              <div class="fin-input-wrapper">
                <span class="material-symbols-outlined fin-input-icon">sell</span>
                <input type="text" id="fin-unidades-vendidas" inputmode="decimal" placeholder="0">
                <label class="fin-field-label">Unidades vendidas</label>
              </div>
            </div>
            <div class="fin-cat-dropdown" id="fin-tamano-dropdown">
              <span class="fin-cat-floating-label">Tamaño</span>
              <button class="fin-cat-dropdown-trigger" id="fin-tamano-trigger" type="button">
                <span class="fin-cat-trigger-content">
                  <span class="material-symbols-outlined fin-cat-trigger-icon">straighten</span>
                  <span class="fin-cat-trigger-label fin-cat-trigger-placeholder">Seleccionar</span>
                </span>
                <span class="material-symbols-outlined fin-cat-trigger-arrow">arrow_drop_down</span>
              </button>
              <div class="fin-cat-dropdown-menu" id="fin-tamano-menu"></div>
            </div>
          </div>
        </section>

        <div id="fin-pago-variedad-wrapper">
          <section style="margin-bottom:16px;display:none;" id="fin-variedad-section">
            <div class="fin-cat-dropdown" id="fin-variedad-dropdown">
              <span class="fin-cat-floating-label">Variedad</span>
              <button class="fin-cat-dropdown-trigger" id="fin-variedad-trigger" type="button">
                <span class="fin-cat-trigger-content">
                  <span class="material-symbols-outlined fin-cat-trigger-icon">grass</span>
                  <span class="fin-cat-trigger-label fin-cat-trigger-placeholder">Seleccionar</span>
                </span>
                <span class="material-symbols-outlined fin-cat-trigger-arrow">arrow_drop_down</span>
              </button>
              <div class="fin-cat-dropdown-menu" id="fin-variedad-menu"></div>
            </div>
          </section>
          <section style="margin-bottom:16px;" id="fin-metodo-pago-section">
            <div class="fin-cat-dropdown" id="fin-metodo-pago-chips">
              <span class="fin-cat-floating-label">Método de pago</span>
              <button class="fin-cat-dropdown-trigger" id="fin-metodo-pago-trigger" type="button">
                <span class="fin-cat-trigger-content">
                  <span class="material-symbols-outlined fin-cat-trigger-icon">payments</span>
                  <span class="fin-cat-trigger-label">Efectivo</span>
                </span>
                <span class="material-symbols-outlined fin-cat-trigger-arrow">arrow_drop_down</span>
              </button>
              <div class="fin-cat-dropdown-menu" id="fin-metodo-pago-menu"></div>
            </div>
          </section>
        </div>

        <!-- Fecha -->
        <div class="fin-field" style="margin-bottom:8px;">
          <div class="fin-input-wrapper" id="fin-fecha-wrapper" style="cursor:pointer;">
            <span class="material-symbols-outlined fin-input-icon fin-fecha-icon">calendar_today</span>
            <input type="text" id="fin-fecha-display" placeholder=" " readonly
              style="cursor:pointer;caret-color:transparent;">
            <label class="fin-field-label" style="cursor:pointer;">Fecha</label>
            <input type="hidden" id="fin-fecha">
          </div>
        </div>

        <!-- Descripción -->
        <div class="fin-field" style="margin-bottom:8px;">
          <div class="fin-input-wrapper textarea-wrapper">
            <span class="material-symbols-outlined fin-input-icon" style="margin-top:0.2rem;">description</span>
            <textarea id="fin-concepto" placeholder=" " rows="3"></textarea>
            <label class="fin-field-label">Descripción</label>
          </div>
        </div>

        <button class="fin-btn-filled primary" id="fin-guardar-btn" disabled style="margin-top:4px;">
          <span class="material-symbols-outlined" style="font-size:18px;">save</span>
          Guardar Registro
        </button>

      </section>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/core/supabase-auth.js"></script>
  <script>window.PAGE_MODE = "finanzas-unified-registro";</script>
  <script src="/js/ui/layout.js"></script>
  <script type="module" src="/js/ui/header.js"></script>
  <script src="/js/finanzas/date-picker-m3.js"></script>
  <script src="/js/finanzas/registrar.js"></script>
</body>
</html>
