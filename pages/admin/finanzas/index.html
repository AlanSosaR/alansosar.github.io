<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Finanzas | Café Cortero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/imagenes/logo.png">

  <link rel="stylesheet" href="/css/core/tipografia.css">
  <link rel="stylesheet" href="/css/ui/header.css">
  <link rel="stylesheet" href="/css/finanzas.css">
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .page-fin-dashboard .fin-card {
      box-shadow: none;
    }
    .page-fin-dashboard a[href*="ingresos"].fin-stat-card {
      box-shadow: 0 10px 40px rgba(55, 123, 76, 0.2);
    }
    .page-fin-dashboard a[href*="egresos"].fin-stat-card {
      box-shadow: 0 10px 40px rgba(198, 40, 40, 0.2);
    }
  </style>
</head>
<body class="finanzas-page page-fin-dashboard">
  <div id="header-placeholder"></div>

  <main class="fin-page">

    <!-- TOP APP BAR -->
    <header class="fin-top-app-bar">
      <h1 class="fin-title">Finanzas</h1>
      <div class="fin-top-actions">
        <button class="fin-icon-btn" aria-label="Notificaciones">
          <span class="material-symbols-outlined">notifications</span>
        </button>
      </div>
    </header>

    <div class="fin-content">

      <!-- SALDO ACTUAL -->
      <section class="fin-saldo-card">
        <div class="fin-saldo-label">Saldo actual</div>
        <div class="fin-saldo-monto" style="font-size:48px;line-height:1.1;">HNL 0,000.00</div>
        <div class="fin-saldo-compare" style="display:flex;align-items:center;gap:6px;justify-content:center;margin-top:12px;">
          <span class="material-symbols-outlined" style="font-size:16px;">trending_up</span>
          <span class="fin-saldo-compare-text"></span>
        </div>
      </section>

      <!-- INGRESOS & EGRESOS -->
      <div class="fin-row-cards">
        <a href="/pages/admin/finanzas/ingresos.html" class="fin-stat-card">
          <div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
              <div class="fin-stat-label" style="color:var(--verde);margin-bottom:0;">Ingresos</div>
              <div class="fin-stat-icon primary" style="margin-bottom:0;">
                <span class="material-symbols-outlined">trending_up</span>
              </div>
            </div>
            <div class="fin-stat-monto primary" id="ingresos-monto"><span style="color:var(--verde);font-weight:600">HNL</span> <span style="color:var(--marron)">0,000.00</span></div>
            <div class="fin-stat-compare" id="ingresos-compare"></div>
          </div>
        </a>
        <a href="/pages/admin/finanzas/egresos.html" class="fin-stat-card">
          <div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
              <div class="fin-stat-label" style="color:var(--md-error);margin-bottom:0;">Egresos</div>
              <div class="fin-stat-icon error" style="margin-bottom:0;">
                <span class="material-symbols-outlined">trending_down</span>
              </div>
            </div>
            <div class="fin-stat-monto error" id="egresos-monto"><span style="color:var(--verde);font-weight:600">HNL</span> <span style="color:var(--marron)">0,000.00</span></div>
            <div class="fin-stat-compare" id="egresos-compare"></div>
          </div>
        </a>
      </div>

      <!-- SEGMENTED BUTTON -->
      <div class="fin-segmented" id="periodo-segmented">
        <button class="fin-seg-btn" data-periodo="dia">Día</button>
        <button class="fin-seg-btn active" data-periodo="semana">Semana</button>
        <button class="fin-seg-btn" data-periodo="mes">Mes</button>
      </div>
      <div class="fin-periodo-label" id="periodo-label"></div>

      <!-- GRÁFICA -->
      <section class="fin-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <h2 class="fin-card-title" style="margin-bottom:0;">Ingresos vs Egresos</h2>
        </div>
        <div class="fin-chart-container" style="height:340px;">
          <canvas id="fin-chart"></canvas>
        </div>
      </section>

      <!-- HISTORIAL -->
      <section class="fin-card">
        <div class="fin-historial-header">
          <h2 class="fin-card-title" style="margin-bottom:0;">Historial</h2>
          <div class="fin-filter-chips">
            <button class="fin-chip active" data-filter="ambos">Ambos</button>
            <button class="fin-chip" data-filter="ingreso">Ingresos</button>
            <button class="fin-chip" data-filter="egreso">Egresos</button>
          </div>
        </div>
        <div id="fin-historial-list"></div>
      </section>
    </div>

    <!-- FAB -->
    <a href="/pages/admin/finanzas/registrar.html" class="fin-fab" id="fin-fab">
      <span class="material-symbols-outlined">add</span>
      <span class="fin-fab-label">Registrar</span>
    </a>

    <!-- BOTTOM SHEET -->
    <div class="fin-bottom-sheet-overlay"></div>
    <div class="fin-bottom-sheet">
      <div class="fin-bottom-sheet-handle"></div>
      <div class="fin-bs-title" id="bs-concepto"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <span class="material-symbols-outlined" id="bs-icon"></span>
        <span id="bs-categoria" style="font:var(--md-label-lg);color:var(--md-on-surface-variant);opacity:0.7;"></span>
      </div>
      <div class="fin-bs-row">
        <span class="fin-bs-label">Monto</span>
        <span id="bs-monto" style="font:var(--md-title-lg);"></span>
      </div>
      <div class="fin-bs-row">
        <span class="fin-bs-label">Fecha</span>
        <span id="bs-fecha"></span>
      </div>
      <div class="fin-bs-row">
        <span class="fin-bs-label">Hora</span>
        <span id="bs-hora"></span>
      </div>
      <div class="fin-bs-row">
        <span class="fin-bs-label">Notas</span>
        <span id="bs-notas"></span>
      </div>
      <div class="fin-bs-actions">
        <button class="fin-btn-outlined">Editar</button>
        <button class="fin-btn-text">Eliminar</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/core/supabase-auth.js"></script>
  <script>window.PAGE_MODE = "finanzas-dashboard";</script>
  <script src="/js/ui/layout.js"></script>
  <script type="module" src="/js/ui/header.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/js/finanzas/dashboard.js"></script>
</body>
</html>
