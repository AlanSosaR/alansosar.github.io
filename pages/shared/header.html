<!-- =====================================================
     HEADER — FINAL DEFINITIVO (STITCH 2025)
====================================================== -->
<header class="header-fixed no-user" id="main-header">

  <!-- IZQUIERDA: LOGO -->
  <div class="header-left-stitch">
    <a href="/pages/home/index.html" class="header-logo-link">
      <img src="/imagenes/logo.png" alt="Café Cortero" class="header-logo">
    </a>
  </div>

  <!-- CENTRO: NAVEGACIÓN Y BÚSQUEDA -->
  <div class="header-middle-stitch">
    <nav class="header-nav-links desktop-only" id="public-nav">
      <a href="/pages/home/index.html" class="nav-link">Inicio</a>
      <a href="/pages/home/index.html#productos" class="nav-link">Variedades</a>
      <a href="https://alansosar.github.io/pages/about/sobre-nosotros.html" class="nav-link">Nosotros</a>
    </nav>
    <div id="header-search-slot"></div>
  </div>

  <!-- DERECHA: ACCIONES -->
  <div class="header-right-stitch">
    
    <!-- Carrito -->
    <button class="header-icon-btn" id="cart-btn" aria-label="Ver carrito">
      <span class="material-symbols-outlined">shopping_cart</span>
      <span id="cart-count" class="cart-badge hidden">0</span>
    </button>

    <!-- Auth / Perfil -->
    <div class="header-auth-group">
      <div class="auth-buttons no-user">
        <a href="/pages/auth/login.html" class="btn-auth-link" id="login-desktop">Iniciar Sesión</a>
        <a href="/pages/auth/registro.html" class="btn-auth-primary desktop-only">Unirse</a>
      </div>

      <button class="header-avatar-button logged hidden" id="btn-header-user" aria-label="Mi Perfil">
        <img id="avatar-user" src="/imagenes/avatar-default.svg" alt="Usuario">
        <span id="avatar-notification-badge" class="notification-badge hidden"><i class="fa-solid fa-bell"></i></span>
      </button>
    </div>

    <!-- Móvil Toggle -->
    <button id="menu-toggle" class="menu-toggle mobile-only" aria-label="Menú">
      <span class="material-symbols-outlined">menu</span>
      <span id="menu-notification-badge" class="notification-badge hidden"><i class="fa-solid fa-bell"></i></span>
    </button>
  </div>

</header>
