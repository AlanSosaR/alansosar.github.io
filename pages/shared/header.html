<!-- =====================================================
     HEADER — FINAL DEFINITIVO (PC + MÓVIL)
     Sincronizado con Stitch 2025 + Soporte Notificaciones
====================================================== -->
<header class="header-fixed no-user" id="main-header">

  <!-- =========================
       BLOQUE IZQUIERDA: LOGO
  ========================= -->
  <div class="header-left-new">
    <a href="/pages/home/index.html" class="header-logo-link">
      <img src="/imagenes/logo.png" alt="Café Cortero" class="header-logo">
    </a>
  </div>

  <!-- =========================
       BLOQUE CENTRO: NAV + BUSQUEDA
  ========================= -->
  <div class="header-middle-stitch">
    <!-- Enlaces de Navegación Desktop -->
    <nav class="header-nav-links desktop-only">
      <a href="/pages/home/index.html" class="nav-link">Inicio</a>
      <a href="/pages/home/index.html#productos" class="nav-link">Variedades</a>
      <a href="https://alansosar.github.io/pages/about/sobre-nosotros.html" class="nav-link">Nosotros</a>
    </nav>
    
    <!-- Espacio para Buscador Dinámico (Admin/Cliente) -->
    <div id="header-search-slot"></div>
  </div>

  <!-- =========================
       BLOQUE DERECHA: ACCIONES
  ========================= -->
  <div class="header-right-stitch">
    
    <!-- Icono Carrito -->
    <button class="header-icon-btn" id="cart-btn" aria-label="Ver carrito">
      <span class="material-symbols-outlined">shopping_cart</span>
      <span id="cart-count" class="cart-badge hidden">0</span>
    </button>

    <!-- Autenticación / Perfil -->
    <div class="header-auth-group">
      <!-- Caso No Logueado -->
      <div class="auth-buttons no-user">
        <a href="/pages/auth/login.html" class="btn-auth-link" id="login-desktop">Iniciar Sesión</a>
        <a href="/pages/auth/registro.html" class="btn-auth-primary desktop-only">Unirse</a>
      </div>

      <!-- Caso Logueado (Avatar con Badge de Notificación) -->
      <button class="header-avatar-button logged hidden" id="btn-header-user" aria-label="Mi Perfil">
        <img id="avatar-user" src="/imagenes/avatar-default.svg" alt="Usuario">
        <!-- Badge de Notificación Perfil (Enganchado a header.js) -->
        <span id="avatar-notification-badge" class="notification-badge hidden" aria-hidden="true">
            <i class="fa-solid fa-bell"></i>
        </span>
      </button>
    </div>

    <!-- Menú Hamburguesa (Mobile con Badge de Notificación) -->
    <button id="menu-toggle" class="menu-toggle mobile-only" aria-label="Menú">
      <span class="material-symbols-outlined">menu</span>
      <span id="menu-notification-badge" class="notification-badge hidden" aria-hidden="true">
        <i class="fa-solid fa-bell"></i>
      </span>
    </button>

  </div>

</header>

<!-- SCREENS SECUNDARIOS -->
<div id="user-scrim" class="user-scrim"></div>

<!-- =====================================================
     DRAWER — MATERIAL 3 (CONSTRUIDO DINÁMICAMENTE)
====================================================== -->
<aside id="user-drawer" class="user-drawer">
  <div class="drawer-header">
     <a href="/pages/profile/perfil.html" class="user-drawer-profile-link logged">
        <div class="user-drawer-avatar">
          <img id="avatar-user-drawer" src="/imagenes/avatar-default.svg" alt="Usuario">
        </div>
        <div class="user-drawer-profile-texts">
          <p id="drawer-name">Usuario</p>
          <p id="drawer-email">correo@ejemplo.com</p>
        </div>
        <span class="material-symbols-outlined">chevron_right</span>
     </a>
  </div>

  <hr class="user-drawer-divider logged">

  <div class="drawer-nav-section client-only logged">
      <a href="/pages/profile/mis-pedidos.html" class="user-drawer-item">
        <span class="material-symbols-outlined">shopping_bag</span>
        <span>Mis pedidos</span>
        <span class="drawer-badge hidden" id="my-orders-count">0</span>
      </a>
      <a href="/pages/profile/historial.html" class="user-drawer-item">
        <span class="material-symbols-outlined">history</span>
        Historial
      </a>
  </div>

  <div class="drawer-nav-section admin-only logged">
      <a href="/pages/admin/admin-pedidos.html" class="user-drawer-item">
        <span class="material-symbols-outlined">inventory_2</span>
        <span>Pedidos</span>
        <span class="drawer-badge hidden" id="admin-orders-count">0</span>
      </a>
      <a href="/pages/admin/admin-clientes.html" class="user-drawer-item">
        <span class="material-symbols-outlined">groups</span>
        Clientes
      </a>
      <a href="/pages/admin/admin-productos.html" class="user-drawer-item">
        <span class="material-symbols-outlined">storefront</span>
        Productos
      </a>
      <a href="/pages/admin/admin-usuarios.html" class="user-drawer-item">
        <span class="material-symbols-outlined">person</span>
        Usuarios
      </a>
  </div>

  <div class="drawer-footer">
      <a href="/pages/auth/login.html" class="user-drawer-item no-user">
        <span class="material-symbols-outlined">login</span>
        Iniciar Sesión
      </a>
      <button id="logout-btn" class="user-drawer-item logout logged">
        <span class="material-symbols-outlined">logout</span>
        Cerrar sesión
      </button>
  </div>
</aside>

<script type="module" src="/js/ui/header.js"></script>
