<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis pedidos | Café Cortero</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/ui/header.css">
  <link rel="stylesheet" href="/css/ui/header.search.css">

  <link rel="stylesheet" href="/css/pages/mis-pedidos.css" />
</head>

<body class="page-mis-pedidos header-checkout">

  <main class="admin-orders-container fade-in" aria-live="polite">

    <!-- El botón "Seguir comprando" ahora se maneja dentro del detalle del pedido o vía drawer -->

    <!-- PEDIDO ACTIVO (VISIBLE POR DEFECTO) -->
    <section id="pedido-activo" class="pedido-activo hidden" aria-label="Detalle del pedido seleccionado">
    </section>

    <!-- EMPTY STATE (SOLO SI NO HAY PEDIDOS) -->
    <section id="empty-state" class="admin-empty-state hidden" aria-hidden="true">
      <h2 class="empty-title">No tienes pedidos</h2>
      <p class="empty-text">Cuando realices un pedido, aparecerá aquí.</p>

      <!-- Imagen dinámica según estado -->
      <img class="empty-illustration" src="" alt="" aria-hidden="true" />
    </section>

    <!-- CARRUSEL (VISIBLE POR DEFECTO) -->
    <section class="related admin-related hidden" id="mis-pedidos-carrusel" aria-label="Listado de pedidos">

      <h3 class="similar-title">Mis pedidos</h3>
      <p class="section-subtitle">Selecciona un pedido para ver su detalle.</p>

      <div class="carousel-container" role="region" aria-roledescription="carousel">

        <button class="carousel-prev-circle" id="pedidos-prev" aria-label="Pedido anterior">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>

        <div class="similar-list" id="pedidos-carrusel" role="list">
        </div>

        <button class="carousel-next-circle" id="pedidos-next" aria-label="Siguiente pedido">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
    </section>
  </main>

  <!-- =========================
     TEMPLATE — PEDIDO ACTIVO
========================= -->
  <template id="pedido-activo-template">
    <section class="order-main">
      <header class="order-preview-header">
        <a href="/pages/home/index.html#productos" class="btn-volver-premium variant-white"
          style="margin-bottom: 1.5rem;">
          <div class="circle-icon">
            <span class="material-symbols-outlined">arrow_back</span>
          </div>
          <span class="text">Seguir comprando</span>
        </a>

        <div class="order-header-text">
          <h2 class="pedido-numero"></h2>
          <span class="pedido-fecha">
            <span class="fecha"></span> · <span class="hora"></span>
          </span>
        </div>
      </header>

      <div class="order-layout">
        <div class="order-text">
          <div class="productos-pills"></div>

          <div class="order-total">
            <span>Total del pedido</span>
            <strong class="pedido-total"></strong>
          </div>

          <section class="order-address">
            <h3>Entrega</h3>
            <p class="entrega-text"></p>
          </section>

          <section class="order-address">
            <h3>Referencia</h3>
            <p class="referencia-text"></p>
          </section>

          <section class="pedido-estado">
            <h3>Estado del pedido</h3>

            <div class="estado-header-dinamico">
              <p class="estado-resumen">
                Paso <span class="estado-paso"></span> de 4 ·
                <strong class="estado-nombre"></strong>
              </p>
              <p class="estado-descripcion"></p>
            </div>

            <ul class="estado-list">
              <li class="estado-item"><span class="dot">1</span><span class="step-text"></span></li>
              <li class="estado-item"><span class="dot">2</span><span class="step-text"></span></li>
              <li class="estado-item"><span class="dot">3</span><span class="step-text"></span></li>
              <li class="estado-item"><span class="dot">4</span><span class="step-text"></span></li>
            </ul>

            <button class="ver-recibo">
              <span class="material-symbols-outlined">receipt_long</span>
              <span>Ver recibo</span>
              <span class="material-symbols-outlined">arrow_forward</span>
            </button>
          </section>
        </div>

        <div class="order-media">
          <img class="recibo-img" src="" alt="Estado del pago" />
        </div>
      </div>
    </section>
  </template>

  <!-- =========================
     TEMPLATE — CARRUSEL
========================= -->
  <template id="pedido-carrusel-template">
    <article class="similar-card" role="listitem">
      <div class="pedido-mini-img-container">
        <img class="pedido-mini-img" src="" alt="Miniatura del pedido" />
      </div>
      <div class="order-card-info">
        <h4 class="pedido-mini-numero"></h4>
        <p class="pedido-mini-total"></p>
        <span class="pedido-mini-status"></span>
      </div>
    </article>
  </template>

  <!-- =========================
     SCRIPTS
========================= -->

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/core/supabase-auth.js"></script>

  <!-- Auth UI (necesario para disparar auth:ready) -->
  <script src="/js/core/auth-ui.js"></script>

  <!-- Layout (inyecta el header) -->
  <script src="/js/ui/layout.js"></script>

  <!-- Header core -->
  <script type="module" src="/js/ui/header.js"></script>

  <!-- 🔍 Buscador global del header — MIS PEDIDOS (CORE FINAL DEFINITIVO) -->
  <script type="module">
    import { renderHeaderSearch } from "/js/ui/header.search.js";

    // ⚠️ Esperar a que layout.js termine de inyectar el header
    document.addEventListener("header:ready", () => {
      const slot = document.getElementById("header-search-slot");

      if (!slot) {
        console.warn("❌ header-search-slot no encontrado");
        return;
      }

      /* =====================================================
         INYECTAR BUSCADOR
      ===================================================== */
      slot.innerHTML = renderHeaderSearch({
        showFilter: true,
        showAdd: false,
        placeholder: "N.º de pedido o café…"
      });

      /* =====================================================
         ESTADO INICIAL → PENDIENTES
      ===================================================== */
      const DEFAULT_STATUS = "pending";

      // Forzar estado inicial
      document.dispatchEvent(
        new CustomEvent("header:filter", {
          detail: DEFAULT_STATUS
        })
      );

      /* =====================================================
         🔍 BÚSQUEDA (NÚMERO DE PEDIDO / TEXTO)
      ===================================================== */
      const input = document.getElementById("header-search-input");

      if (input) {
        input.addEventListener("input", (e) => {
          const value = e.target.value.trim();

          // Emitir SIEMPRE, incluso vacío (reset)
          document.dispatchEvent(
            new CustomEvent("header:search", {
              detail: value
            })
          );
        });
      }

      /* =====================================================
         🎯 FILTRO POR ESTADO
      ===================================================== */
      const filter = document.getElementById("header-status-filter");

      if (filter) {
        // Mostrar Pendientes por defecto
        filter.value = DEFAULT_STATUS;

        filter.addEventListener("change", (e) => {
          document.dispatchEvent(
            new CustomEvent("header:filter", {
              detail: e.target.value
            })
          );
        });
      }

      console.log("🔍 Buscador del header listo (Mis pedidos)");
    });
  </script>

  <!-- Página Mis Pedidos -->
  <script type="module" src="/js/pages/mis-pedidos.js"></script>

</body>

</html>
