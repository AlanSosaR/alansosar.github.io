<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta | Café Cortero</title>

  <!-- Tipografía global -->
  <link rel="stylesheet" href="/css/core/tipografia.css">

  <!-- Iconos Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <!-- Titulares M3 Fraunces -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap" rel="stylesheet">

  <!-- CSS del formulario -->
  <link rel="stylesheet" href="/css/auth/registro-cliente.css?v=7">
</head>

<body>

  <main class="register-container">

    <section class="register-card">

      <!-- BOTÓN BACK DENTRO DE LA TARJETA -->
      <button class="back-btn" onclick="window.location.href='/pages/auth/login.html'">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>

      <!-- HEADER -->
      <div class="register-header">
        <div class="logo-container" onclick="window.location.href='/pages/home/index.html'">
          <img src="/imagenes/logo.png" alt="Café Cortero" class="logo-img">
        </div>
        <h2 class="register-title">Crear cuenta</h2>
      </div>

      <!-- CARD FORMULARIO -->
      <div class="register-inner-card outlined-card">

        <form id="registroForm" novalidate>

          <!-- NOMBRE -->
          <div class="m3-field">
            <div class="m3-input">
              <span class="material-symbols-outlined">person</span>
              <input id="nombreInput" type="text" placeholder=" ">
              <label for="nombreInput" class="floating-label">Nombre completo</label>
            </div>
            <small class="m3-error" id="errorNombre"></small>
          </div>

          <!-- CORREO -->
          <div class="m3-field">
            <div class="m3-input">
              <span class="material-symbols-outlined">mail</span>
              <input id="correoInput" type="email" placeholder=" ">
              <label for="correoInput" class="floating-label">Correo electrónico</label>
            </div>
            <small class="m3-error" id="errorCorreo"></small>
          </div>

          <!-- TELÉFONO -->
          <div class="m3-field">
            <div class="m3-input">
              <span class="material-symbols-outlined">call</span>
              <input id="telefonoInput" type="tel" placeholder=" ">
              <label for="telefonoInput" class="floating-label">Teléfono</label>
            </div>
            <small class="m3-error" id="errorTelefono"></small>
          </div>

          <!-- CONTRASEÑA -->
          <div class="m3-field">
            <div class="m3-input">
              <span class="material-symbols-outlined">lock</span>
              <input id="passwordInput" type="password" placeholder=" ">
              <label for="passwordInput" class="floating-label">Contraseña</label>
              <span class="material-symbols-outlined toggle-pass" data-target="passwordInput">visibility</span>
            </div>

            <div class="strength-bars" id="barsContainer">
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
            </div>

            <small class="m3-error" id="errorPassword"></small>
          </div>

          <!-- CONFIRMAR CONTRASEÑA -->
          <div class="m3-field">
            <div class="m3-input">
              <span class="material-symbols-outlined">lock</span>
              <input id="confirmPasswordInput" type="password" placeholder=" ">
              <label for="confirmPasswordInput" class="floating-label">Confirmar contraseña</label>
              <span class="material-symbols-outlined toggle-pass" data-target="confirmPasswordInput">visibility</span>
            </div>
            <small class="m3-error" id="errorConfirm"></small>
          </div>

          <!-- BOTÓN -->
          <button type="submit" class="m3-btn">
            <span class="loader"></span>
            <span class="btn-text">Crear cuenta</span>
          </button>

        </form>
        <!-- snackbar-->
        <div id="snackbar" class="snackbar hidden" role="status" aria-live="polite">
          <span class="snackbar__msg"></span>

          <div class="snackbar__actions">
            <button type="button" class="snackbar__btn snackbar__btn--text" data-action="cancel">
              Cancelar
            </button>

            <button type="button" class="snackbar__btn snackbar__btn--filled" data-action="confirm">
              Confirmar
            </button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- ====================================================== -->
  <!-- 🚀 ORDEN CORRECTO DE SCRIPTS                           -->
  <!-- ====================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Scripts normales -->
  <script src="/js/core/supabase-client-core.js"></script>
  <script src="/js/core/supabase-auth.js"></script>
  <script src="/js/auth/registro-cliente.js"></script>
  <script src="/js/core/auth-ui.js"></script>

</body>

</html>
