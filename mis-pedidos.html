<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mis pedidos | Café Cortero</title>

  <!-- Tipografía -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500&display=swap"
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="css/header.css?v=30">
  <link rel="stylesheet" href="css/mis-pedidos.css?v=5">
</head>

<body class="page-mis-pedidos header-checkout">

  <!-- Header global -->
  <!-- Inyectado por layout.js -->

  <!-- Volver -->
  <div class="seguir-comprando">
    <button class="icon-back" onclick="location.href='index.html#productos'">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <span class="seguir-link">Seguir comprando</span>
  </div>

  <main class="mis-pedidos-layout">

    <!-- =========================
         PEDIDO ACTIVO (GRANDE)
    ========================== -->
    <section id="pedido-activo" class="pedido-activo">
      <!-- Render JS -->
    </section>

    <!-- =========================
         CARRUSEL
    ========================== -->
    <section class="pedidos-carrusel">
      <h4 class="carrusel-title">Otros pedidos</h4>
      <div class="carrusel-wrapper" id="pedidos-carrusel"></div>
    </section>

    <!-- EMPTY -->
    <section class="empty-state hidden" id="empty-state">
      <h2>Tu lista de pedidos está vacía</h2>
      <p>Agrega tus cafés favoritos para continuar.</p>
      <button class="btn-principal" onclick="location.href='index.html#productos'">
        Seguir comprando
      </button>
    </section>

  </main>

  <!-- =========================
       TEMPLATES
  ========================== -->

  <!-- PEDIDO ACTIVO -->
  <template id="pedido-activo-template">
    <article class="pedido-card pedido-card--grande">

      <!-- HEADER -->
      <header class="pedido-header">
        <h2 class="pedido-numero">Pedido N.º 013</h2>
        <p class="pedido-fecha">
          <span class="fecha">30 ene 2026</span> ·
          <span class="hora">02:13 p. m.</span>
        </p>
      </header>

      <!-- PRODUCTOS -->
      <section class="pedido-productos">
        <div class="productos-pills">
          <!-- dinámico -->
          <span class="pill">Café tradición × 1</span>
        </div>

        <p class="pedido-total">
          Total: <strong>L 300.00</strong>
        </p>
      </section>

      <!-- ENTREGA -->
      <section class="pedido-entrega">
        <p><strong>Entrega:</strong> Barrio abajo, Danlí, El Paraíso</p>
        <p><strong>Referencia:</strong> Por la mañana</p>
      </section>

      <!-- =========================
           ESTADO DEL PEDIDO
      ========================== -->
      <section class="pedido-estado">

        <p class="estado-title">Estado del pedido</p>

        <!-- TEXTO PRINCIPAL -->
        <p class="estado-resumen">
          Paso <span class="estado-paso">1</span> de 4 ·
          <strong class="estado-nombre">Pendiente de pago</strong>
        </p>

        <!-- LISTA VERTICAL -->
        <ul class="estado-list">

          <li class="estado-item activo" data-estado="pagado">
            <span class="dot">1</span>
            <span class="label">Pagado</span>
          </li>

          <li class="estado-item" data-estado="revision">
            <span class="dot">2</span>
            <span class="label">Revisión</span>
          </li>

          <li class="estado-item" data-estado="confirmado">
            <span class="dot">3</span>
            <span class="label">Confirmado</span>
          </li>

          <li class="estado-item" data-estado="envio">
            <span class="dot">4</span>
            <span class="label">Envío</span>
          </li>

          <!-- CANCELADO (fuera del flujo) -->
          <li class="estado-item estado-cancelado hidden" data-estado="cancelado">
            <span class="dot">×</span>
            <span class="label">Cancelado</span>
          </li>

        </ul>

        <!-- DESCRIPCIÓN CONTEXTUAL -->
        <p class="estado-descripcion">
          Estamos esperando tu comprobante de pago para continuar con tu pedido.
        </p>

      </section>

      <!-- =========================
           RECIBO
      ========================== -->
      <section class="pedido-recibo">
        <button class="ver-recibo">
          <span>Ver recibo</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>

        <div class="recibo-preview">
          <img src="img/recibo-placeholder.png" alt="Comprobante de pago">
        </div>
      </section>

    </article>
  </template>

  <!-- PEDIDO MINI -->
  <template id="pedido-carrusel-template">
    <article class="pedido-mini-card">
      <p class="pedido-mini-numero">Pedido N.º 012</p>
      <p class="pedido-mini-total">L 1,400.00</p>
      <span class="pedido-mini-status">Nuevo</span>
    </article>
  </template>

  <!-- =========================
       SCRIPTS
  ========================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/core/supabase-client-core.js"></script>
  <script src="js/core/supabase-auth.js"></script>
  <script src="js/core/auth-ui.js"></script>
  <script src="js/ui/layout.js"></script>
  <script type="module" src="js/ui/header.js"></script>

  <!-- Lógica cliente -->
  <script type="module" src="js/pages/mis-pedidos.js"></script>

</body>
</html>
